<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">TEVV field-trial statistics</title>
  <desc id="d">Banner. Confidence intervals for an observed 90 percent success rate narrow as the number of trials grows from 10 to 200.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; fill: #6B7688; }

    .ci { opacity: 1; animation: ci 8s ease-in-out infinite both; }
    .ci1 { animation-delay: 0s; } .ci2 { animation-delay: 0.8s; }
    .ci3 { animation-delay: 1.6s; } .ci4 { animation-delay: 2.4s; }
    @keyframes ci {
      0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 95% { opacity: 0; } 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
  <rect width="1200" height="400" fill="#F5F7FA"/>
  <text x="64.0" y="84.0" class="mono" font-size="13" fill="#6B7688" text-anchor="start" font-weight="400" letter-spacing="0.12em">DARKANALYTICA</text>
  <rect x="64" y="112" width="56" height="3" fill="#0B2545"/>
  <text x="64.0" y="178.0" class="display" font-size="46" fill="#0E1726" text-anchor="start" font-weight="600" >TEVV Field-Trial</text>
  <text x="64.0" y="232.0" class="display" font-size="46" fill="#0E1726" text-anchor="start" font-weight="600" >Statistics</text>
  <text x="64.0" y="284.0" class="sans" font-size="19" fill="#3D4A5C" text-anchor="start" font-weight="400" >How many runs a claim needs, and what</text>
  <text x="64.0" y="312.0" class="sans" font-size="19" fill="#3D4A5C" text-anchor="start" font-weight="400" >the runs you have actually show.</text>
  <text x="64.0" y="352.0" class="mono" font-size="13" fill="#6B7688" text-anchor="start" font-weight="400" >success run  ·  Wilson interval  ·  PPV  ·  CEP50 / R95</text>
  <text x="720.0" y="92.0" class="mono" font-size="12" fill="#6B7688" text-anchor="start" font-weight="400" letter-spacing="0.06em">OBSERVED 90% SUCCESS · 95% WILSON INTERVAL</text>
  <g class="ci ci1">
    <line x1="779.4" y1="140" x2="1018.9" y2="140" stroke="#0B2545" stroke-width="2"/>
    <line x1="779.4" y1="132" x2="779.4" y2="148" stroke="#0B2545" stroke-width="2"/>
    <line x1="1018.9" y1="132" x2="1018.9" y2="148" stroke="#0B2545" stroke-width="2"/>
    <circle cx="968.0" cy="140" r="4.5" fill="#8A6A1F"/>
    <text x="708.0" y="144.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="end" font-weight="400" >n = 10</text>
    <text x="1032.9" y="144.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="start" font-weight="400" >0.60 to 0.98</text>
  </g>
  <g class="ci ci2">
    <line x1="843.4" y1="190" x2="1012.7" y2="190" stroke="#0B2545" stroke-width="2"/>
    <line x1="843.4" y1="182" x2="843.4" y2="198" stroke="#0B2545" stroke-width="2"/>
    <line x1="1012.7" y1="182" x2="1012.7" y2="198" stroke="#0B2545" stroke-width="2"/>
    <circle cx="968.0" cy="190" r="4.5" fill="#8A6A1F"/>
    <text x="708.0" y="194.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="end" font-weight="400" >n = 20</text>
    <text x="1026.7" y="194.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="start" font-weight="400" >0.70 to 0.97</text>
  </g>
  <g class="ci ci3">
    <line x1="905.1" y1="240" x2="1001.1" y2="240" stroke="#0B2545" stroke-width="2"/>
    <line x1="905.1" y1="232" x2="905.1" y2="248" stroke="#0B2545" stroke-width="2"/>
    <line x1="1001.1" y1="232" x2="1001.1" y2="248" stroke="#0B2545" stroke-width="2"/>
    <circle cx="968.0" cy="240" r="4.5" fill="#8A6A1F"/>
    <text x="708.0" y="244.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="end" font-weight="400" >n = 60</text>
    <text x="1015.1" y="244.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="start" font-weight="400" >0.80 to 0.95</text>
  </g>
  <g class="ci ci4">
    <line x1="937.4" y1="290" x2="989.3" y2="290" stroke="#0B2545" stroke-width="2"/>
    <line x1="937.4" y1="282" x2="937.4" y2="298" stroke="#0B2545" stroke-width="2"/>
    <line x1="989.3" y1="282" x2="989.3" y2="298" stroke="#0B2545" stroke-width="2"/>
    <circle cx="968.0" cy="290" r="4.5" fill="#8A6A1F"/>
    <text x="708.0" y="294.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="end" font-weight="400" >n = 200</text>
    <text x="1003.3" y="294.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="start" font-weight="400" >0.85 to 0.93</text>
  </g>
  <line x1="720" y1="330" x2="1030" y2="330" stroke="#D8DEE6" stroke-width="1.5"/>
  <line x1="720.0" y1="330" x2="720.0" y2="336" stroke="#6B7688" stroke-width="1"/>
  <text x="720.0" y="352.0" class="mono" font-size="12" fill="#6B7688" text-anchor="middle" font-weight="400" >0.5</text>
  <line x1="782.0" y1="330" x2="782.0" y2="336" stroke="#6B7688" stroke-width="1"/>
  <text x="782.0" y="352.0" class="mono" font-size="12" fill="#6B7688" text-anchor="middle" font-weight="400" >0.6</text>
  <line x1="844.0" y1="330" x2="844.0" y2="336" stroke="#6B7688" stroke-width="1"/>
  <text x="844.0" y="352.0" class="mono" font-size="12" fill="#6B7688" text-anchor="middle" font-weight="400" >0.7</text>
  <line x1="906.0" y1="330" x2="906.0" y2="336" stroke="#6B7688" stroke-width="1"/>
  <text x="906.0" y="352.0" class="mono" font-size="12" fill="#6B7688" text-anchor="middle" font-weight="400" >0.8</text>
  <line x1="968.0" y1="330" x2="968.0" y2="336" stroke="#6B7688" stroke-width="1"/>
  <text x="968.0" y="352.0" class="mono" font-size="12" fill="#6B7688" text-anchor="middle" font-weight="400" >0.9</text>
  <line x1="1030.0" y1="330" x2="1030.0" y2="336" stroke="#6B7688" stroke-width="1"/>
  <text x="1030.0" y="352.0" class="mono" font-size="12" fill="#6B7688" text-anchor="middle" font-weight="400" >1.0</text>
  <line x1="968.0" y1="118" x2="968.0" y2="330" stroke="#8A6A1F" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
</svg>

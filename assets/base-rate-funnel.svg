<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
  <title id="t">The base-rate funnel</title>
  <desc id="d">Out of 10,000 decision opportunities with 1 percent prevalence, Pd 0.95 and Pfa 0.02 give 95 true alarms and 198 false alarms, so only 32.4 percent of alarms are real.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; fill: #7A8088; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
  <rect width="1000" height="560" fill="#F6F4EF"/>
  <text x="60.0" y="52.0" class="mono" font-size="12" fill="#7A8088" text-anchor="start" font-weight="400" letter-spacing="0.04em">ASSUMPTIONS  Pd = 0.95  ·  Pfa = 0.02 per decision  ·  prevalence = 1%</text>
  <g class="">
    <rect x="300" y="76" width="400" height="62" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="300" y="76" width="400" height="3" rx="1.5" fill="#1F3A5F"/>
    <text x="500.0" y="102.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >10,000 decision opportunities</text>
    <text x="500.0" y="122.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >events screened</text>
  </g>
  <g class="">
    <rect x="120" y="196" width="300" height="62" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="120" y="196" width="300" height="3" rx="1.5" fill="#5B7083"/>
    <text x="270.0" y="222.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >100 target present</text>
    <text x="270.0" y="242.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >1% prevalence</text>
  </g>
  <g class="">
    <rect x="580" y="196" width="300" height="62" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="580" y="196" width="300" height="3" rx="1.5" fill="#5B7083"/>
    <text x="730.0" y="222.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >9,900 target absent</text>
    <text x="730.0" y="242.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >99%</text>
  </g>
  <path d="M 500 138 L 500 167 L 270 167 L 270 196" fill="none" stroke="#5B7083" stroke-width="1.75"/>
  <path d="M 500 138 L 500 167 L 730 167 L 730 196" fill="none" stroke="#5B7083" stroke-width="1.75"/>
  <g class="">
    <rect x="40" y="316" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="40" y="316" width="220" height="3" rx="1.5" fill="#5E7F68"/>
    <text x="150.0" y="342.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >95 true alarms</text>
    <text x="150.0" y="362.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >Pd 0.95</text>
  </g>
  <g class="">
    <rect x="280" y="316" width="170" height="62" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="280" y="316" width="170" height="3" rx="1.5" fill="#7A8088"/>
    <text x="365.0" y="342.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >5 misses</text>
    <text x="365.0" y="362.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >1 − Pd</text>
  </g>
  <g class="">
    <rect x="530" y="316" width="190" height="62" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="530" y="316" width="190" height="3" rx="1.5" fill="#A33A2B"/>
    <text x="625.0" y="342.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >198 false alarms</text>
    <text x="625.0" y="362.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >Pfa 0.02</text>
  </g>
  <g class="">
    <rect x="740" y="316" width="220" height="62" rx="4" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
    <rect x="740" y="316" width="220" height="3" rx="1.5" fill="#7A8088"/>
    <text x="850.0" y="342.0" class="sans" font-size="15" fill="#1B1F24" text-anchor="middle" font-weight="600" >9,702 correct quiet</text>
    <text x="850.0" y="362.0" class="mono" font-size="12" fill="#4A5058" text-anchor="middle" font-weight="400" >1 − Pfa</text>
  </g>
  <path d="M 270 258 L 270 287 L 150 287 L 150 316" fill="none" stroke="#5B7083" stroke-width="1.75"/>
  <path d="M 270 258 L 270 287 L 365 287 L 365 316" fill="none" stroke="#5B7083" stroke-width="1.75"/>
  <path d="M 730 258 L 730 287 L 625 287 L 625 316" fill="none" stroke="#5B7083" stroke-width="1.75"/>
  <path d="M 730 258 L 730 287 L 850 287 L 850 316" fill="none" stroke="#5B7083" stroke-width="1.75"/>
  <path d="M 150 378 L 150 410 L 500 410 L 500 440" fill="none" stroke="#5E7F68" stroke-width="1.75"/>
  <path d="M 625 378 L 625 410 L 500 410" fill="none" stroke="#A33A2B" stroke-width="1.75"/>
  <rect x="150" y="440" width="227.0" height="40" fill="#EAF0EB" stroke="#5E7F68" stroke-width="1.5"/>
  <rect x="377.0" y="440" width="473.0" height="40" fill="#F6E9E6" stroke="#A33A2B" stroke-width="1.5"/>
  <text x="263.5" y="465.0" class="sans" font-size="14" fill="#1B1F24" text-anchor="middle" font-weight="600" >95 real</text>
  <text x="613.5" y="465.0" class="sans" font-size="14" fill="#1B1F24" text-anchor="middle" font-weight="600" >198 false</text>
  <text x="500.0" y="512.0" class="serif" font-size="19" fill="#1B1F24" text-anchor="middle" font-weight="600" >293 alarms  →  PPV = 95 / 293 = 0.324</text>
  <text x="500.0" y="538.0" class="sans" font-size="13" fill="#7A8088" text-anchor="middle" font-weight="400" >Two alarms in three are false, although Pd is 95% and Pfa only 2%. Tiers above are not to scale; the bar is.</text>
</svg>
